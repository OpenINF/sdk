name: Release

# Manual only. Pushing to main -- including merging the "Version packages" PR
# -- does nothing here; releasing is always something a maintainer asks for.
on:
  workflow_dispatch:

# Deny by default at the workflow level; the release job below re-grants only
# the three scopes it actually needs.
permissions: {}

# Never let two releases run at once: both would try to push the version
# branch and publish the same versions. Each run waits its turn instead of
# replacing the one already pending, so a dispatch from another ref cannot
# cancel a main release that is waiting.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump branch and its tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # mint the OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets needs history to tell which changesets are new.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prepublishOnly builds each package, but building here too means a
      # broken build fails the job before anything is published.
      - run: pnpm run build

      # What a run does depends on whether changesets are pending:
      #   - pending  -> opens/updates the "Version packages" PR. Nothing ships.
      #   - none     -> publishes whatever versions are not yet on the registry.
      # So a release is two deliberate runs: one to raise the PR, and one after
      # merging it to publish.
      #
      # Version 2 of the action renamed every input this step uses, and it
      # throws rather than ignoring the old names, so the upgrade and the renames
      # have to land together. It also takes the token as an input, defaulting to
      # the workflow's own, and refuses a GITHUB_TOKEN environment variable that
      # disagrees with it, so none is set here.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: '📦：version packages'
          pr-title: '📦：version packages'

      # The action creates releases only for tags its current run created. If
      # tag pushing succeeded but release creation failed, a retry sees the tag
      # as old and cannot repair the missing release. Reconcile every publish-
      # mode run so that the operation is safely resumable.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: node tools/reconcile-github-releases.mts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The portal renders this release's API reference from a versioned
      # Markdown artifact, which it keeps one directory of per release. Only a
      # run that published has versions for one to describe; the run that opens
      # the version PR has nothing to document yet, so these are skipped there.
      #
      # Building it here rather than earlier ties it to the versions that
      # actually shipped, and to the commit they were published from.
      # Run these on every publish-mode invocation. This lets a retry recreate
      # an artifact when publication and releases succeeded but documentation
      # generation or upload failed afterward.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm run docs:build

      - if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm run docs:artifact

      # Handing this to the portal is a deliberate step, the way publishing is:
      # see "Publishing the API reference" in RELEASING.md.
      - if: steps.changesets.outputs.has-changesets == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-api-docs
          path: docs/artifact/
          if-no-files-found: error
