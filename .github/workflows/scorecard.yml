name: Scorecard

# OpenSSF Scorecard grades the repository's security practices (branch
# protection, pinned dependencies, token permissions, SAST coverage, and so
# on) and publishes the result to the Security tab.
#
# Requires a public repository: the checks read history through an API the
# default token cannot reach on a private one, and publishing the result is
# public by definition. The job waits for that rather than failing until then.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF result
      id-token: write # sign the result so it can be published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
