name: CodeQL

# Static analysis for the TypeScript sources. Runs on every change to main and
# on pull requests, plus weekly so that newly published queries reach existing
# code without waiting for someone to touch it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze
    # Code scanning on a private repository needs GitHub Advanced Security,
    # and without it the upload is refused and the job fails. Waits for this
    # repository to be public, where code scanning is available to everyone.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: this is a library with no bundling, so CodeQL's own
      # extraction of the TypeScript sources is what we want to analyze.
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: '/language:javascript-typescript'
